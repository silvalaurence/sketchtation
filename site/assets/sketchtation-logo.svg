<svg xmlns="http://www.w3.org/2000/svg" width="740" height="180" viewBox="0 0 740 180" role="img" aria-label="Sketchtation" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <!-- two slightly different "wobble" filters so the two pencil passes never line up perfectly -->
    <filter id="rough1" x="-5%" y="-20%" width="110%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2"/>
    </filter>
    <filter id="rough2" x="-5%" y="-20%" width="110%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.4"/>
    </filter>

    <!-- hand-drawn letterforms: S K E T C H T A T I O N -->
    <g id="word" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path transform="translate(40 40)"  d="M35 12C28-1 6 2 7 16C8 30 34 28 34 44C34 60 10 62 3 48"/>
      <g    transform="translate(92 40)">
        <path d="M8 2L7 58"/><path d="M34 4C24 20 16 28 8 32"/><path d="M14 30C22 40 30 50 36 58"/>
      </g>
      <g    transform="translate(144 40)">
        <path d="M34 4L9 3L8 58L35 57"/><path d="M9 30L28 29"/>
      </g>
      <g    transform="translate(196 40)">
        <path d="M3 4L37 5"/><path d="M20 5L19 58"/>
      </g>
      <path transform="translate(248 40)" d="M35 14C28 0 6 2 5 30C4 58 28 62 36 46"/>
      <g    transform="translate(300 40)">
        <path d="M7 3L6 58"/><path d="M33 2L34 57"/><path d="M7 30L33 29"/>
      </g>
      <g    transform="translate(352 40)">
        <path d="M3 4L37 5"/><path d="M20 5L19 58"/>
      </g>
      <g    transform="translate(404 40)">
        <path d="M4 58L20 3L36 58"/><path d="M11 38L29 37"/>
      </g>
      <g    transform="translate(456 40)">
        <path d="M3 4L37 5"/><path d="M20 5L19 58"/>
      </g>
      <g    transform="translate(508 40)">
        <path d="M20 3L20 58"/><path d="M12 4L28 4"/><path d="M12 57L28 57"/>
      </g>
      <path transform="translate(560 40)" d="M21 2C6 0 1 30 6 48C12 62 34 60 37 36C40 14 30 0 17 3"/>
      <path transform="translate(612 40)" d="M7 58L8 3L33 57L34 2"/>
    </g>
  </defs>

  <!-- faint construction guides, like a pencil layout -->
  <g stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 6" opacity=".45">
    <line x1="24" y1="40" x2="700" y2="40"/>
    <line x1="24" y1="98" x2="700" y2="98"/>
  </g>

  <!-- pass 2: thin, lighter, offset re-trace -->
  <use href="#word" stroke="#64748b" stroke-width="1.8" opacity=".75" filter="url(#rough2)" transform="translate(1.8 -1.6) rotate(-0.25 370 70)"/>
  <!-- pass 1: bold main stroke -->
  <use href="#word" stroke="#1f2a44" stroke-width="5.5" filter="url(#rough1)"/>

  <!-- scribbled underline -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#rough2)">
    <path d="M40 124C150 116 260 130 370 120S580 126 650 118" stroke="#2563eb" stroke-width="4"/>
    <path d="M70 134C190 128 330 138 470 130S600 134 628 130" stroke="#2563eb" stroke-width="1.8" opacity=".55"/>
  </g>

  <!-- little pencil finishing the underline -->
  <g transform="translate(646 92) scale(2.4)" fill="#fff" stroke="#2563eb" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/>
    <path d="m14.5 5.5 3 3"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
